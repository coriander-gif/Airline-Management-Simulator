<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AIRLINE TYCOON JAPAN v0.1.3</title>
    <style>
        /* ==========================================================================
           CSS Reset & Variables (Theme Support)
           ========================================================================== */
        :root {
            /* Light Theme (Default) */
            --col-bg-dark: #f1f5f9; 
            --col-bg-panel: #ffffff;
            --col-bg-hover: #e2e8f0;
            --col-text-main: #0f172a;
            --col-text-muted: #64748b;
            --col-primary: #0284c7;
            --col-primary-hover: #0369a1;
            --col-danger: #ef4444;
            --col-success: #10b981;
            --col-warning: #f59e0b;
            --col-map-ocean: #e0f2fe;
            --col-map-land: #d1d5db;
            --col-map-border: #9ca3af;
            --col-marker-default: #3b82f6;
            --col-marker-text: #0f172a;
            --col-marker-text-outline: rgba(255, 255, 255, 0.8);
            --shadow-color: rgba(0,0,0,0.1);
            --shadow-strong: rgba(0,0,0,0.15);
            --panel-border: #e2e8f0;
            
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        [data-theme="dark"] {
            /* Dark Theme */
            --col-bg-dark: #0f172a; 
            --col-bg-panel: #1e293b;
            --col-bg-hover: #334155;
            --col-text-main: #f8fafc;
            --col-text-muted: #94a3b8;
            --col-primary: #3b82f6;
            --col-primary-hover: #2563eb;
            --col-danger: #ef4444;
            --col-success: #10b981;
            --col-warning: #f59e0b;
            --col-map-ocean: #09111c;
            --col-map-land: #1e293b;
            --col-map-border: #334155;
            --col-marker-default: #60a5fa;
            --col-marker-text: #ffffff;
            --col-marker-text-outline: rgba(15, 23, 42, 0.8);
            --shadow-color: rgba(0,0,0,0.5);
            --shadow-strong: rgba(0,0,0,0.7);
            --panel-border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: var(--font-family); background-color: var(--col-bg-dark); color: var(--col-text-main); overflow: hidden; width: 100vw; height: 100vh; height: 100dvh; display: flex; flex-direction: column; transition: background-color 0.3s, color 0.3s; }
        input, select, textarea { user-select: auto; }

        /* Utilities */
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { display: flex; flex-direction: column; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .w-full { width: 100%; }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .text-success { color: var(--col-success); }
        .text-danger { color: var(--col-danger); }
        .text-warning { color: var(--col-warning); }
        .text-muted { color: var(--col-text-muted); }
        .font-bold { font-weight: bold; }
        
        .btn { background-color: var(--col-primary); color: white; border: none; padding: 10px 20px; font-size: 0.9rem; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background-color 0.2s, transform 0.1s; display: inline-flex; align-items: center; justify-content: center; }
        .btn:hover:not(:disabled) { background-color: var(--col-primary-hover); }
        .btn:active:not(:disabled) { transform: scale(0.98); }
        .btn:disabled { background-color: var(--col-bg-hover); color: var(--col-text-muted); cursor: not-allowed; }
        .btn-outline { background-color: transparent; border: 2px solid var(--col-primary); color: var(--col-primary); }
        .btn-outline:hover:not(:disabled) { background-color: rgba(59, 130, 246, 0.1); }
        .btn-danger { background-color: var(--col-danger); color: white; }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; }

        .input-group { margin-bottom: 1rem; display: flex; flex-direction: column; }
        .input-group label { margin-bottom: 0.4rem; font-size: 0.85rem; color: var(--col-text-muted); }
        .input-field { background-color: var(--col-bg-dark); color: var(--col-text-main); border: 1px solid var(--col-map-border); padding: 8px; border-radius: 6px; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
        .input-field:focus { border-color: var(--col-primary); }

        /* Load Factor Badge System */
        .lf-badge { font-weight: bold; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; display: inline-block; }
        .lf-very-low { background-color: rgba(239, 68, 68, 0.15); color: var(--col-danger); }
        .lf-low { background-color: rgba(245, 158, 11, 0.15); color: var(--col-warning); }
        .lf-normal { background-color: rgba(2, 132, 199, 0.15); color: var(--col-primary); }
        .lf-high { background-color: rgba(16, 185, 129, 0.15); color: var(--col-success); }
        .lf-very-high { background-color: rgba(16, 185, 129, 0.3); color: var(--col-success); border: 1px solid var(--col-success); }

        /* Screens Layouts */
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; background-color: var(--col-bg-dark); z-index: 10; }
        .theme-toggle { position: absolute; top: 20px; right: 20px; z-index: 50; background-color: var(--col-bg-panel); color: var(--col-text-main); border: 1px solid var(--panel-border); border-radius: 20px; padding: 8px 16px; font-size: 0.85rem; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px var(--shadow-color); display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .theme-toggle:hover { background-color: var(--col-bg-hover); }

        /* Toast Notifications */
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { background-color: var(--col-bg-panel); color: var(--col-text-main); padding: 12px 24px; border-radius: 8px; box-shadow: 0 4px 12px var(--shadow-strong); border-left: 4px solid var(--col-primary); font-size: 0.9rem; font-weight: bold; opacity: 0; transform: translateY(-20px); transition: opacity 0.3s, transform 0.3s; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { border-left-color: var(--col-danger); }
        .toast.success { border-left-color: var(--col-success); }

        /* Title Screen */
        #screen-title { align-items: center; justify-content: center; background: radial-gradient(circle at center, var(--col-bg-panel) 0%, var(--col-bg-dark) 100%); }
        .title-logo { font-size: 2.5rem; font-weight: 900; margin-bottom: 3rem; text-shadow: 0 4px 10px var(--shadow-color); letter-spacing: 2px;}
        .title-logo span { color: var(--col-primary); }
        .title-menu { display: flex; flex-direction: column; gap: 1rem; width: 250px; }

        /* Form Screen */
        .form-container { background-color: var(--col-bg-panel); padding: 2rem; border-radius: 12px; width: 100%; max-width: 500px; margin: auto; box-shadow: 0 10px 25px var(--shadow-strong); border: 1px solid var(--panel-border); }
        .form-title { font-size: 1.5rem; margin-bottom: 1.5rem; border-bottom: 2px solid var(--panel-border); padding-bottom: 0.5rem;}

        /* Main Headquarters Layout */
        #screen-hq { display: flex; flex-direction: column; }
        .hq-header { background-color: var(--col-bg-panel); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--panel-border); height: 65px; flex-shrink: 0; z-index: 25; }
        .header-company { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 1.2rem; min-width: max-content; }
        .brand-color-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--col-bg-panel); box-shadow: 0 0 2px var(--shadow-color);}
        .header-stats { display: flex; gap: 15px; font-size: 0.9rem; flex-wrap: wrap; justify-content: flex-end; align-items: center; padding-right: 120px; }
        .stat-item { display: flex; flex-direction: column; align-items: flex-end;}
        .stat-label { font-size: 0.65rem; color: var(--col-text-muted); }
        .stat-value { font-weight: bold; font-family: monospace; font-size: 1.05rem;}

        .hq-body { display: flex; flex: 1; overflow: hidden; position: relative; }
        .hq-sidebar { width: 200px; background-color: var(--col-bg-panel); border-right: 1px solid var(--panel-border); display: flex; flex-direction: column; flex-shrink: 0; z-index: 20; }
        .nav-item { padding: 15px 20px; color: var(--col-text-main); cursor: pointer; border-bottom: 1px solid var(--panel-border); transition: background-color 0.2s; display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; }
        .nav-item:hover { background-color: var(--col-bg-hover); }
        .nav-item.active { background-color: var(--col-primary); color: white; font-weight: bold; border-left: 4px solid var(--col-primary-hover); }
        .nav-soon { font-size: 0.65rem; background-color: var(--col-bg-hover); padding: 2px 6px; border-radius: 10px; color: var(--col-text-muted);}
        
        .hq-main-view { flex: 1; position: relative; overflow: hidden; background-color: var(--col-bg-dark); }
        
        /* Map View */
        #view-map { background-color: var(--col-map-ocean); touch-action: none; width: 100%; height: 100%; position: absolute; }
        .map-controls { position: absolute; top: 15px; left: 15px; display: flex; flex-direction: column; gap: 5px; z-index: 15; }
        .map-btn { background-color: var(--col-bg-panel); color: var(--col-text-main); border: 1px solid var(--panel-border); border-radius: 6px; width: 40px; height: 40px; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px var(--shadow-color); transition: 0.2s; }
        .map-btn:hover { background-color: var(--col-bg-hover); }
        #map-svg { width: 100%; height: 100%; touch-action: none; display: block; }
        #map-svg.dragging { cursor: grabbing; }
        
        /* Map Overlays & Styling */
        .airport-marker circle { transition: stroke-width 0.2s; }
        .airport-marker:hover circle { stroke-width: 3px; }
        .airport-marker.selected circle { stroke-width: 3px; stroke: #fff; filter: drop-shadow(0 0 4px var(--col-text-main)); }
        .airport-label { font-family: var(--font-family); font-weight: bold; font-size: 10px; fill: var(--col-marker-text); pointer-events: none; transition: opacity 0.3s; }
        .airport-label-outline { stroke: var(--col-marker-text-outline); stroke-width: 2.5px; stroke-linejoin: round; fill: none; pointer-events: none;}
        .airport-marker .label-group { opacity: 0; }
        .airport-marker.always-show .label-group { opacity: 1; z-index: 100; }
        .zoom-level-1 .airport-marker.is-major .label-group { opacity: 1; }
        .zoom-level-2 .airport-marker .label-group { opacity: 1; }
        .airport-marker.selected .label-group { opacity: 1; }
        
        .route-line { fill: none; stroke-width: 2px; stroke-dasharray: 4; opacity: 0.7; pointer-events: none; }
        .route-line.selected { stroke-width: 4px; stroke-dasharray: none; opacity: 1; filter: drop-shadow(0 0 3px rgba(0,0,0,0.5)); }

        /* Panels (Management Screens) */
        .mgmt-panel { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--col-bg-dark); padding: 20px; overflow-y: auto; z-index: 10; display: none; }
        .mgmt-panel.active { display: block; }
        .panel-header-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 20px; border-bottom: 2px solid var(--panel-border); padding-bottom: 10px; }
        
        /* Grids & Cards for Management */
        .data-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .card { background-color: var(--col-bg-panel); border: 1px solid var(--panel-border); border-radius: 8px; padding: 15px; box-shadow: 0 2px 4px var(--shadow-color); display: flex; flex-direction: column; }
        .card-header { font-weight: bold; font-size: 1.1rem; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--col-bg-dark); padding-bottom: 5px; }
        .card-body { font-size: 0.85rem; color: var(--col-text-main); flex: 1; }
        .card-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .card-footer { margin-top: 15px; display: flex; gap: 10px; justify-content: flex-end; }
        .badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .badge-lease { background-color: var(--col-warning); color: #fff; }
        .badge-owned { background-color: var(--col-success); color: #fff; }
        .badge-active { background-color: rgba(16, 185, 129, 0.15); color: var(--col-success); }
        .badge-idle { background-color: rgba(100, 116, 139, 0.15); color: var(--col-text-muted); }

        /* Side Panel (Airport Info) */
        .side-panel { position: absolute; top: 0; right: 0; width: 340px; height: 100%; background-color: var(--col-bg-panel); border-left: 1px solid var(--panel-border); box-shadow: -5px 0 15px var(--shadow-color); transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; z-index: 20; }
        .side-panel.open { transform: translateX(0); }
        .panel-header { padding: 15px; background-color: var(--col-bg-hover); border-bottom: 1px solid var(--panel-border); display: flex; justify-content: space-between; align-items: center; }
        .panel-close { cursor: pointer; color: var(--col-text-muted); font-size: 2rem; line-height: 1; padding: 0 10px;}
        .panel-close:hover { color: var(--col-text-main); }
        .panel-content { padding: 20px; overflow-y: auto; flex: 1; }
        .ap-title { font-size: 1.4rem; font-weight: bold; margin-bottom: 5px;}
        .ap-codes { font-family: monospace; color: var(--col-primary); font-size: 1.1rem; margin-bottom: 15px;}
        .ap-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;}
        .ap-info-box { background-color: var(--col-bg-dark); padding: 10px; border-radius: 6px; border: 1px solid var(--panel-border); }
        .ap-info-label { font-size: 0.75rem; color: var(--col-text-muted); margin-bottom: 3px;}
        .ap-info-val { font-weight: bold; font-size: 0.9rem;}

        /* Table Responsive Container */
        .table-container { width: 100%; overflow-x: auto; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 10px; white-space: nowrap; }
        .data-table th, .data-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--panel-border); }
        .data-table th { background-color: var(--col-bg-hover); font-weight: bold; color: var(--col-text-muted); }
        .data-table tr:hover td { background-color: var(--col-bg-dark); }

        /* News Ticker */
        .news-ticker { height: 30px; background-color: var(--col-bg-dark); border-top: 1px solid var(--panel-border); display: flex; align-items: center; padding: 0 15px; font-size: 0.85rem; color: var(--col-text-muted); white-space: nowrap; overflow: hidden; flex-shrink: 0; }
        .news-label { background-color: var(--col-primary); color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; margin-right: 10px; }
        
        /* Modal System */
        #custom-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh; background-color: var(--shadow-strong); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(2px); }
        .modal-content { background-color: var(--col-bg-panel); width: 90%; max-width: 550px; max-height: 90vh; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 40px var(--shadow-strong); border: 1px solid var(--panel-border); }
        .modal-header { padding: 15px 20px; background-color: var(--col-bg-dark); font-weight: bold; border-bottom: 1px solid var(--panel-border); display: flex; justify-content: space-between; }
        .modal-body { padding: 20px; font-size: 0.95rem; line-height: 1.5; overflow-y: auto; flex: 1; }
        .modal-footer { padding: 15px 20px; background-color: var(--col-bg-hover); display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--panel-border); }

        /* Mobile Adjustments & Cards View */
        .routes-cards-mobile { display: none; }
        @media (max-width: 768px) {
            .hq-header { flex-wrap: wrap; height: auto; padding: 10px; padding-top: 50px; gap: 10px; }
            .header-stats { width: 100%; justify-content: flex-start; padding-right: 0; gap: 10px;}
            .hq-sidebar { position: absolute; transform: translateX(-100%); transition: transform 0.3s; z-index: 30; height: 100%; box-shadow: 2px 0 10px var(--shadow-color); }
            .hq-sidebar.open { transform: translateX(0); }
            .side-panel { width: 100%; max-width: 400px; border-left: none; box-shadow: -2px 0 10px var(--shadow-strong); }
            .mobile-menu-btn { display: block !important; background: none; border: none; color: var(--col-text-main); font-size: 1.5rem; margin-right: 10px;}
            .theme-toggle { top: 10px; right: 10px; padding: 6px 12px; }

            .table-container { display: none; }
            .routes-cards-mobile { display: flex; flex-direction: column; gap: 10px; }
        }
        .mobile-menu-btn { display: none; cursor: pointer; }
    </style>
</head>
<body>

    <button class="theme-toggle" id="btn-theme-toggle" onclick="ThemeManager.toggleTheme()">
        <span class="theme-icon" id="theme-icon">🌙</span>
        <span id="theme-text">ダークモード</span>
    </button>

    <div id="toast-container"></div>

    <div id="custom-modal" class="hidden">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modal-title">Message</span>
                <span style="cursor:pointer; color:var(--col-text-muted);" onclick="UI.hideModal()">✕</span>
            </div>
            <div class="modal-body" id="modal-message">...</div>
            <div class="modal-footer" id="modal-footer-btns">
                <button class="btn" onclick="UI.hideModal()">OK</button>
            </div>
        </div>
    </div>

    <!-- Screen 1: Title -->
    <div id="screen-title" class="screen">
        <div class="title-logo">AIRLINE TYCOON <span>JAPAN</span></div>
        <div class="title-menu">
            <button class="btn" onclick="Game.startNewGame()">NEW GAME</button>
            <button class="btn btn-outline" id="btn-continue" onclick="Game.continueGame()" disabled>CONTINUE</button>
            <button class="btn btn-outline" onclick="UI.showCredits()">CREDITS</button>
        </div>
        <div style="position: absolute; bottom: 20px; color: var(--col-text-muted); font-size: 0.8rem;">Version 0.1.3 (Management Improvement)</div>
    </div>

    <!-- Screen 2: New Company -->
    <div id="screen-new-company" class="screen hidden" style="justify-center; padding: 20px; overflow-y: auto;">
        <div class="form-container" style="margin-top: auto; margin-bottom: auto;">
            <h2 class="form-title">新規航空会社 設立申請</h2>
            <form id="form-setup" onsubmit="Game.submitNewCompany(event)">
                <div class="input-group">
                    <label for="c-name">航空会社名 (2〜30文字)</label>
                    <input type="text" id="c-name" class="input-field" minlength="2" maxlength="30" required placeholder="例: Japan Sky Airlines">
                </div>
                <div class="flex" style="gap: 15px;">
                    <div class="input-group w-full">
                        <label for="c-iata">IATAコード (英大2文字)</label>
                        <input type="text" id="c-iata" class="input-field" pattern="[A-Za-z]{2}" oninput="this.value = this.value.toUpperCase()" required placeholder="例: JS" title="半角英字2文字">
                    </div>
                    <div class="input-group w-full">
                        <label for="c-icao">ICAOコード (英大3文字)</label>
                        <input type="text" id="c-icao" class="input-field" pattern="[A-Za-z]{3}" oninput="this.value = this.value.toUpperCase()" required placeholder="例: JSK" title="半角英字3文字">
                    </div>
                </div>
                <div class="flex" style="gap: 15px;">
                    <div class="input-group w-full">
                        <label for="c-color">ブランドカラー</label>
                        <input type="color" id="c-color" class="input-field" value="#0ea5e9" style="height: 44px; padding: 5px; cursor: pointer;">
                    </div>
                    <div class="input-group w-full">
                        <label for="c-hq">本社拠点空港</label>
                        <select id="c-hq" class="input-field" required></select>
                    </div>
                </div>
                <div class="flex justify-between" style="margin-top: 1rem;">
                    <button type="button" class="btn btn-outline" onclick="UI.switchScreen('screen-title')">キャンセル</button>
                    <button type="submit" class="btn">設立を完了する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Screen 3: Headquarters -->
    <div id="screen-hq" class="screen hidden">
        <header class="hq-header">
            <div class="flex items-center">
                <button class="mobile-menu-btn" onclick="UI.toggleSidebar()">☰</button>
                <div class="header-company">
                    <div id="hq-brand-dot" class="brand-color-dot"></div>
                    <span id="hq-comp-name">Company Name</span>
                </div>
            </div>
            
            <div class="header-stats">
                <div class="stat-item"><span class="stat-label">現在の日付</span><span class="stat-value" id="hq-date">-</span></div>
                <div class="stat-item"><span class="stat-label">保有資金</span><span class="stat-value text-success" id="hq-funds">-</span></div>
                <div class="stat-item"><span class="stat-label">航空機</span><span class="stat-value" id="hq-fleet">0</span></div>
                <div class="stat-item"><span class="stat-label">路線</span><span class="stat-value" id="hq-routes">0</span></div>
                <button class="btn" style="padding: 5px 15px; font-size: 0.9rem; margin-left: 10px;" onclick="Logic.advanceDay()">NEXT DAY ➔</button>
            </div>
        </header>

        <div class="hq-body">
            <!-- Navigation -->
            <aside class="hq-sidebar" id="hq-sidebar">
                <div class="nav-item active" onclick="UI.switchMainView('view-map', this)">経営本部 (MAP)</div>
                <div class="nav-item" onclick="UI.switchMainView('view-fleet', this)">機材管理</div>
                <div class="nav-item" onclick="UI.switchMainView('view-routes', this)">路線管理</div>
                <div class="nav-item" onclick="UI.showSoon('財務・統計管理')">財務・統計 <span class="nav-soon">SOON</span></div>
                <div style="flex:1;"></div>
                <div class="nav-item" onclick="Game.manualSave()">💾 セーブ</div>
                <div class="nav-item text-danger" onclick="Game.returnToTitle()">ログアウト</div>
            </aside>

            <!-- Dynamic Views Area -->
            <div class="hq-main-view">
                <!-- 1. Map View -->

        const JapanPolygons = [
            [[41.4,140.2], [45.5,142.0], [44.3,145.3], [42.0,143.2], [41.4,140.2]],
            [[40.9,140.5], [37.9,139.0], [36.7,136.7], [34.7,131.5], [33.4,135.8], [34.6,138.8], [35.6,140.0], [38.3,141.5], [40.9,140.5]],

        let Player = null;

        // ==========================================
        // Utility Functions
        // ==========================================
        const Utils = {
            formatMoney: (n) => {
                if (n === null || n === undefined || isNaN(n)) return "0円";
                const isNeg = n < 0;
                const abs = Math.abs(Math.round(n));
                return (isNeg ? "-" : "") + new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY', maximumFractionDigits: 0 }).format(abs);
            },
            formatDate: (ds) => {
                if (!ds) return "-";
                const [y,m,d] = ds.split('-').map(Number);
                const date = new Date(y, m-1, d);
                const w = ['日','月','火','水','木','金','土'];
                return `${date.getFullYear()}/${date.getMonth()+1}/${date.getDate()}(${w[date.getDay()]})`;
            },
            isValidDate: (y, m, d) => {
                const date = new Date(y, m - 1, d);
                return date.getFullYear() === y && date.getMonth() === m - 1 && date.getDate() === d;
            },
            haversine: (lat1, lon1, lat2, lon2) => {
                const R = 6371; const dLat = (lat2-lat1)*Math.PI/180; const dLon = (lon2-lon1)*Math.PI/180;
                const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
                return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
            },
            genRegNum: () => `JA${String(Math.floor(Math.random()*900)+100)}${Player.company.iata}`,
            
            getLoadFactorBadgeHtml: (lf) => {
                let badgeClass = 'lf-normal';
                let text = '普通';
                if (lf < 40) { badgeClass = 'lf-very-low'; text = '非常に低い'; }
                else if (lf < 60) { badgeClass = 'lf-low'; text = '低い'; }
                else if (lf < 80) { badgeClass = 'lf-normal'; text = '普通'; }
                else if (lf < 95) { badgeClass = 'lf-high'; text = '高い'; }
                else { badgeClass = 'lf-very-high'; text = '非常に高い'; }
                return `<span class="lf-badge ${badgeClass}">${lf}% (${text})</span>`;
            }
        };

        // ==========================================
        // UI Manager
        // ==========================================
        const UI = {
            switchScreen(id) { document.querySelectorAll('.screen').forEach(e => e.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); },
            switchMainView(id, navElem) {
                document.querySelectorAll('.mgmt-panel').forEach(e => e.classList.remove('active'));
                document.getElementById(id).classList.add('active');
                document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
                if(navElem) navElem.classList.add('active');
                if(window.innerWidth <= 768) this.toggleSidebar();
                if(id === 'view-fleet') Views.renderFleet();
                if(id === 'view-routes') Views.renderRoutes();
            },
            showModal(title, msg, contentHtml = null, btnsHtml = null) {
                document.getElementById('modal-title').textContent = title;
                const body = document.getElementById('modal-message');
                if (contentHtml) body.innerHTML = contentHtml; else body.textContent = msg;
                const footer = document.getElementById('modal-footer-btns');
                footer.innerHTML = btnsHtml || '<button class="btn" onclick="UI.hideModal()">OK</button>';
                document.getElementById('custom-modal').classList.remove('hidden');
            },
            hideModal() { document.getElementById('custom-modal').classList.add('hidden'); },
            showToast(msg, type='info') {
                const c = document.getElementById('toast-container'); const t = document.createElement('div'); t.className = `toast ${type}`; t.textContent = msg;
                c.appendChild(t); void t.offsetWidth; t.classList.add('show');
                setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
            },
            updateHeader() {
                if (!Player || !Player.company) return;
                document.getElementById('hq-comp-name').textContent = Player.company.name;
                document.getElementById('hq-brand-dot').style.backgroundColor = Player.company.color;
                document.getElementById('hq-date').textContent = Utils.formatDate(Player.company.date);
                document.getElementById('hq-funds').textContent = Utils.formatMoney(Player.company.funds);
                document.getElementById('hq-fleet').textContent = Player.company.fleet.length;
                document.getElementById('hq-routes').textContent = Player.company.routes.length;
                
                if (Player.company.funds < 0) document.getElementById('hq-funds').classList.replace('text-success', 'text-danger');
                else document.getElementById('hq-funds').classList.replace('text-danger', 'text-success');
            },
            updateNews() {
                if (Player && Player.history && Player.history.length > 0) {
                    document.getElementById('news-ticker-text').textContent = `${Utils.formatDate(Player.history[0].date)} - ${Player.history[0].msg}`;
                }
            },
            showSoon(feature) { this.showModal('開発中', `${feature}機能は現在開発中です。`); },
            toggleSidebar() { document.getElementById('hq-sidebar').classList.toggle('open'); },
            
            showAirportDetails(apId) {
                const ap = GameData.Airports.find(a => a.id === apId); if(!ap) return;
                const isHQ = Player.company.hq === ap.id;
                document.getElementById('panel-airport-content').innerHTML = `
                    <div class="ap-title">${ap.name}</div>
                    <div class="ap-codes">${ap.iata} / ${ap.icao}</div>
                    <div class="ap-info-grid">
                        <div class="ap-info-box"><div class="ap-info-label">規模</div><div class="ap-info-val">${'★'.repeat(ap.scale)}</div></div>
                        <div class="ap-info-box"><div class="ap-info-label">需要指数</div><div class="ap-info-val">${ap.demand}</div></div>
                        <div class="ap-info-box"><div class="ap-info-label">拠点</div><div class="ap-info-val">${isHQ?'<span class="text-success">本社拠点</span>':'-'}</div></div>
                        <div class="ap-info-box"><div class="ap-info-label">都道府県</div><div class="ap-info-val">${ap.pref}</div></div>
                    </div>
                    <button class="btn btn-outline w-full" onclick="Views.showRouteCreateModal('${ap.id}')">この空港から路線を開設</button>
                `;
                document.getElementById('panel-airport').classList.add('open');
            },
            closeAirportPanel() { document.getElementById('panel-airport').classList.remove('open'); MapSystem.clearSelection(); }

        // ==========================================
        // Logic (Core Gameplay System & Calculations)
        // ==========================================
        const Logic = {
            buyAircraft(acId, isLease) {
                const ac = GameData.Aircrafts.find(a => a.id === acId);
                if (!ac) return false;
                const cost = isLease ? ac.leaseInit : ac.price;
                if (Player.company.funds < cost) {
                    UI.showToast("資金が不足しています。", "error"); return false;
                }
                Player.company.funds -= cost;
                const reg = Utils.genRegNum();
                Player.company.fleet.push({
                    reg: reg, typeId: ac.id, status: 'idle', routeId: null,
                    isLeased: isLease, age: 0, 
                    stats: { flights: 0, pax: 0, rev: 0 }
                });
                const t = isLease ? "リース契約" : "購入";
                Player.history.unshift({ date: Player.company.date, msg: `${ac.name} (${reg}) を${t}しました。` });
                UI.hideModal(); UI.updateHeader(); UI.showToast(`${ac.name}を${t}しました！`, "success");
                Views.renderFleet();
                Game.saveData(true); // Auto-save
                return true;
            },

            returnLease(reg) {
                const idx = Player.company.fleet.findIndex(f => f.reg === reg);
                if (idx === -1) return;
                const plane = Player.company.fleet[idx];
                if (plane.routeId) { UI.showToast("路線に割り当て中のため返却できません。", "error"); return; }
                Player.company.fleet.splice(idx, 1);
                Player.history.unshift({ date: Player.company.date, msg: `リース機 ${reg} を返却しました。` });
                UI.showToast(`${reg} を返却しました。`); Views.renderFleet(); UI.updateHeader();
                Game.saveData(true); // Auto-save
            },

            createRoute(fromId, toId) {
                if (fromId === toId) { UI.showToast("同じ空港は選択できません", "error"); return; }
                const routeId = [fromId, toId].sort().join('-');
                if (Player.company.routes.find(r => r.id === routeId)) { UI.showToast("既に路線が存在します", "error"); return; }
                
                const from = GameData.Airports.find(a => a.id === fromId);
                const to = GameData.Airports.find(a => a.id === toId);
                if (!from || !to) { UI.showToast("不正な空港が指定されました", "error"); return; }

                const dist = Utils.haversine(from.lat, from.lon, to.lat, to.lon);
                const cost = Math.floor(dist * 100000 + (from.scale + to.scale) * 5000000);
                
                if (Player.company.funds < cost) { UI.showToast("開設費用が不足しています", "error"); return; }
                
                Player.company.funds -= cost;
                Player.company.routes.push({
                    id: routeId, from: fromId, to: toId, distance: dist, assignedReg: null,
                    stats: { 
                        flights: 0, pax: 0, rev: 0, profit: 0, 
                        lastLf: 0, lastPax: 0, lastRev: 0, lastCost: 0, lastProfit: 0, lastFlights: 0
                    }
                });
                Player.history.unshift({ date: Player.company.date, msg: `${from.name} - ${to.name} 線を開設しました。` });
                UI.hideModal(); UI.updateHeader(); UI.showToast("路線を開設しました", "success");
                MapSystem.drawRoutes(); Views.renderRoutes(); UI.switchMainView('view-routes', document.querySelectorAll('.nav-item')[2]);
                Game.saveData(true); // Auto-save
            },

            // Safe Assign Aircraft System
            assignAircraft(routeId, reg) {
                const route = Player.company.routes.find(r => r.id === routeId);
                if (!route) { UI.showToast("路線が見つかりません", "error"); return; }

                if (reg === 'none') {
                    // Unassign logic
                    if (route.assignedReg) {
                        const oldPlane = Player.company.fleet.find(f => f.reg === route.assignedReg);
                        if (oldPlane) { oldPlane.routeId = null; oldPlane.status = 'idle'; }
                        route.assignedReg = null;
                    }
                    UI.hideModal(); Views.renderRoutes(); Views.renderFleet(); MapSystem.drawRoutes();
                    Game.saveData(true);
                    return;
                }

                const plane = Player.company.fleet.find(f => f.reg === reg);
                if (!plane) { UI.showToast("指定された機材が存在しません", "error"); return; }

                const acDef = GameData.Aircrafts.find(a => a.id === plane.typeId);
                if (!acDef) { UI.showToast("機材データが不正です", "error"); return; }

                // Validation before modifying state
                if (plane.routeId && plane.routeId !== routeId) {
                    UI.showToast("この機材はすでに別の路線に割り当てられています", "error"); return;
                }
                if (acDef.range < route.distance) {
                    UI.showToast(`航続距離が不足しています (路線: ${route.distance}km / 航続: ${acDef.range}km)`, "error"); return;
                }

                // Everything valid -> Commit state change safely
                if (route.assignedReg) {
                    const oldPlane = Player.company.fleet.find(f => f.reg === route.assignedReg);
                    if (oldPlane) { oldPlane.routeId = null; oldPlane.status = 'idle'; }
                }
                plane.routeId = routeId;
                plane.status = 'active';
                route.assignedReg = reg;

                UI.hideModal(); Views.renderRoutes(); Views.renderFleet(); MapSystem.drawRoutes();
                UI.showToast(`機材 ${reg} を割り当てました`, "success");
                Game.saveData(true); // Auto-save
            },

            // --- IMPROVED DAILY OPERATION SYSTEM ---
            advanceDay() {
                const dateParts = Player.company.date.split('-').map(Number);
                let y = dateParts[0], m = dateParts[1], d = dateParts[2] + 1;
                // Calendar check
                const daysInMonth = new Date(y, m, 0).getDate();
                if (d > daysInMonth) { d = 1; m++; if (m > 12) { m = 1; y++; } }
                Player.company.date = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

                let totalCompanyRev = 0;
                let totalCompanyCost = 0;
                let totalPax = 0;
                let totalFlights = 0;
                let resultsHtml = '';

                // Track unallocated lease costs
                let unallocatedCost = 0;

                // Process Fleet Status & Costs
                Player.company.fleet.forEach(f => {
                    const ac = GameData.Aircrafts.find(a => a.id === f.typeId);
                    if (!f.routeId) {
                        f.status = 'idle';
                        if (f.isLeased && ac) {
                            unallocatedCost += ac.leaseDaily;
                        }
                    }
                });

                // Operations & Financial Calculations per Route
                Player.company.routes.forEach(route => {
                    let rRev = 0, rCost = 0, rPax = 0, rFlights = 0, rLf = 0;
                    let rFuel = 0, rAirport = 0, rMaint = 0, rLease = 0;

                    if (route.assignedReg) {
                        const plane = Player.company.fleet.find(f => f.reg === route.assignedReg);
                        const ac = GameData.Aircrafts.find(a => a.id === plane.typeId);
                        const from = GameData.Airports.find(a => a.id === route.from);
                        const to = GameData.Airports.find(a => a.id === route.to);

                        if (plane && ac && from && to && ac.range >= route.distance) {
                            // 1. Calculate Flights (14h ops window, 45m turnaround)
                            const flightTimeH = route.distance / ac.speed;
                            const blockTimeH = flightTimeH + 0.75;
                            const maxTrips = Math.floor(14 / blockTimeH);
                            const dailyFlights = Math.floor(maxTrips / 2) * 2; // Pair roundtrips

                            if (dailyFlights > 0) {
                                const capacity = dailyFlights * ac.seats;

                                // 2. Enhanced Demand & Load Factor Model
                                const baseDemand = Math.sqrt(from.demand * to.demand) * 2.8;
                                const distFactor = Math.max(0.4, 1.2 - (route.distance / 2500));
                                const repFactor = (Player.company.reputation || 50) / 50;
                                const awFactor = (Player.company.awareness || 10) / 20;

                                // Fare Effect
                                const standardFare = 3000 + (route.distance * 18);
                                const actualFare = standardFare; // Default fare
                                const fareRatio = actualFare / standardFare;
                                const fareFactor = Math.max(0.5, 1.5 - (0.5 * fareRatio));

                                // Daily slight variation (0.95 - 1.05)
                                const dailyFluctuation = 0.95 + (Math.random() * 0.1);

                                const potentialPax = Math.floor(baseDemand * distFactor * repFactor * awFactor * fareFactor * dailyFluctuation * 2.2);

                                rPax = Math.min(potentialPax, capacity);
                                rLf = Math.min(100, Math.round((rPax / capacity) * 100));

                                // Revenue
                                rRev = Math.floor(rPax * actualFare);

                                // 3. Accurate Route Costs
                                rFuel = Math.floor(route.distance * ac.fuelRate * dailyFlights * GameData.FUEL_UNIT_PRICE);
                                rAirport = Math.floor((from.scale + to.scale) * 25000 * dailyFlights);
                                rMaint = ac.maint;
                                rLease = plane.isLeased ? ac.leaseDaily : 0;

                                rCost = rFuel + rAirport + rMaint + rLease;
                                rFlights = dailyFlights;

                                // Update Fleet & Route Lifetime Stats
                                route.stats.flights = (route.stats.flights || 0) + rFlights;
                                route.stats.pax = (route.stats.pax || 0) + rPax;
                                route.stats.rev = (route.stats.rev || 0) + rRev;
                                route.stats.profit = (route.stats.profit || 0) + (rRev - rCost);

                                plane.stats.flights = (plane.stats.flights || 0) + rFlights;
                                plane.stats.pax = (plane.stats.pax || 0) + rPax;
                                plane.stats.rev = (plane.stats.rev || 0) + rRev;
                                plane.status = 'active';
                            } else {
                                plane.status = 'idle';
                                if (plane.isLeased) rLease = ac.leaseDaily; // Allocated lease cost even if not flying
                                rCost = rLease;
                            }
                        }
                    }

                    // Update Route Last Performance
                    route.stats.lastLf = rLf;
                    route.stats.lastPax = rPax;
                    route.stats.lastRev = rRev;
                    route.stats.lastCost = rCost;
                    route.stats.lastProfit = rRev - rCost;
                    route.stats.lastFlights = rFlights;

                    totalCompanyRev += rRev;
                    totalCompanyCost += rCost;
                    totalPax += rPax;
                    totalFlights += rFlights;

                    if (rFlights > 0) {
                        resultsHtml += `
                            <div class="card-row" style="margin-bottom:6px; border-bottom:1px solid var(--panel-border); padding-bottom:4px;">
                                <span><b>${route.id}</b> (${rFlights}便)</span> 
                                <span>${Utils.getLoadFactorBadgeHtml(rLf)} 利益: <b class="${rRev - rCost >= 0 ? 'text-success' : 'text-danger'}">${Utils.formatMoney(rRev - rCost)}</b></span>
                            </div>`;
                    }
                });

                // Add unallocated costs (idle leased planes)
                totalCompanyCost += unallocatedCost;

                const dailyProfit = totalCompanyRev - totalCompanyCost;
                Player.company.funds += dailyProfit;

                UI.updateHeader();

                // Show Daily Summary Modal
                let sumHtml = `
                    <div class="data-grid" style="margin-bottom:15px;">
                        <div class="card">
                            <div class="card-row"><span>総運航便数</span><span>${totalFlights}便</span></div>
                            <div class="card-row"><span>総搭乗旅客数</span><span>${totalPax.toLocaleString()}人</span></div>
                        </div>
                        <div class="card">
                            <div class="card-row"><span>日次総売上</span><span class="text-success">+${Utils.formatMoney(totalCompanyRev)}</span></div>
                            <div class="card-row"><span>日次総費用</span><span class="text-danger">-${Utils.formatMoney(totalCompanyCost)}</span></div>
                            ${unallocatedCost > 0 ? `<div class="card-row" style="font-size:0.75rem; color:var(--col-text-muted);"><span>(うち待機機材リース料)</span><span>-${Utils.formatMoney(unallocatedCost)}</span></div>` : ''}
                            <hr style="border:0; border-top:1px solid var(--panel-border); margin:4px 0;">
                            <div class="card-row font-bold">
                                <span>会社日次損益</span><span class="${dailyProfit >= 0 ? 'text-success' : 'text-danger'}">${Utils.formatMoney(dailyProfit)}</span>
                            </div>
                        </div>
                    </div>
                    <div style="font-size:0.9rem; font-weight:bold; margin-bottom:5px;">路線別運航結果</div>
                    <div style="font-size:0.85rem; max-height:160px; overflow-y:auto; background:var(--col-bg-dark); padding:10px; border-radius:6px; border:1px solid var(--panel-border);">
                        ${totalFlights > 0 ? resultsHtml : '<div class="text-muted text-center" style="padding:10px;">本日の運航便はありません。</div>'}
                    </div>
                `;
                UI.showModal(`${Utils.formatDate(Player.company.date)} 運航報告`, "", sumHtml);

                if (document.getElementById('view-routes').classList.contains('active')) Views.renderRoutes();
                if (document.getElementById('view-fleet').classList.contains('active')) Views.renderFleet();

                Game.saveData(true); // Autosave after turn
            }
        };

            project(lat, lon) {
                const x = ((lon - 127.0) / (146.5 - 127.0)) * this.width;
                const r = Math.PI / 180;
                const yLat = Math.log(Math.tan(Math.PI/4 + (lat * r)/2));
                const yMin = Math.log(Math.tan(Math.PI/4 + (25.5 * r)/2));
                const yMax = Math.log(Math.tan(Math.PI/4 + (46.0 * r)/2));
                const y = this.height - ((yLat - yMin) / (yMax - yMin)) * this.height;
                return { x, y };
            },

            initMap() {

                    lg.appendChild(to); lg.appendChild(tt); g.appendChild(hit); g.appendChild(c); g.appendChild(lg); mGroup.appendChild(g);

            drawRoutes() {

                Player.company.routes.forEach(r => {

                    l.setAttribute("class", "route-line"); l.setAttribute("stroke", Player.company.color);
                    rg.appendChild(l);

            },

            updateTransform() {
                const maxPanX = this.width * this.scale * 1.2; const maxPanY = this.height * this.scale * 1.2;
                this.currentX = Math.max(-maxPanX, Math.min(this.currentX, this.width)); this.currentY = Math.max(-maxPanY, Math.min(this.currentY, this.height));
                document.getElementById('map-transform-group').setAttribute('transform', `translate(${this.currentX}, ${this.currentY}) scale(${this.scale})`);
                const mg = document.getElementById('map-markers');
                mg.className = this.scale >= 2.2 ? 'zoom-level-2' : (this.scale >= 1.4 ? 'zoom-level-1' : 'zoom-level-0');
            },

            applyZoom(f, cx, cy) {
                let ns = Math.max(0.8, Math.min(this.scale * f, 10));
                this.currentX = cx - (cx - this.currentX) * (ns / this.scale); this.currentY = cy - (cy - this.currentY) * (ns / this.scale);
                this.scale = ns; this.updateTransform();
            },
            zoomIn() { this.applyZoom(1.5, this.width/2, this.height/2); },
            zoomOut() { this.applyZoom(1/1.5, this.width/2, this.height/2); },
            resetView() { const m = window.innerWidth<=768; this.scale = m?1.0:1.3; this.currentX = -50; this.currentY = m?-50:-100; this.updateTransform(); },
            
            getSVGCoords(cx, cy) {
                const svg = document.getElementById('map-svg'); const pt = svg.createSVGPoint(); pt.x = cx; pt.y = cy;
                const ctm = svg.getScreenCTM(); return ctm ? pt.matrixTransform(ctm.inverse()) : {x:0, y:0};
            },

            setupInteractions() {
                const svg = document.getElementById('map-svg');
                let pointers = new Map(), dragStart = null, isDrag = false, initDist = null, initScale = null;
                
                svg.onpointerdown = e => {
                    pointers.set(e.pointerId, e); svg.setPointerCapture(e.pointerId);
                    if(pointers.size===1) { isDrag = true; dragStart = {x:e.clientX, y:e.clientY}; svg.classList.add('dragging'); }
                    else if(pointers.size===2) { isDrag = false; const pts = Array.from(pointers.values()); initDist = Math.hypot(pts[0].clientX-pts[1].clientX, pts[0].clientY-pts[1].clientY); initScale = this.scale; }
                };
                svg.onpointermove = e => {
                    if(!pointers.has(e.pointerId)) return;
                    const prevE = pointers.get(e.pointerId); pointers.set(e.pointerId, e);
                    if(pointers.size===1 && isDrag) {
                        const ctm = svg.getScreenCTM();
                        if(ctm) { this.currentX += (e.clientX-prevE.clientX)/ctm.a; this.currentY += (e.clientY-prevE.clientY)/ctm.d; this.updateTransform(); }
                    } else if(pointers.size===2 && initDist>0) {
                        const pts = Array.from(pointers.values()); const d = Math.hypot(pts[0].clientX-pts[1].clientX, pts[0].clientY-pts[1].clientY);
                        const c = this.getSVGCoords((pts[0].clientX+pts[1].clientX)/2, (pts[0].clientY+pts[1].clientY)/2);
                        let ns = Math.max(0.8, Math.min(initScale*(d/initDist), 10));
                        this.currentX = c.x - (c.x - this.currentX)*(ns/this.scale); this.currentY = c.y - (c.y - this.currentY)*(ns/this.scale);
                        this.scale = ns; this.updateTransform();
                    }
                };
                const end = e => {
                    if(!pointers.has(e.pointerId)) return;
                    if(pointers.size===1 && dragStart && Math.hypot(e.clientX-dragStart.x, e.clientY-dragStart.y)<8) {
                        const tgt = document.elementFromPoint(e.clientX, e.clientY); const mk = tgt ? tgt.closest('.airport-marker') : null;
                        if(mk) {
                            if(this.selId) { const p = document.querySelector(`.airport-marker[data-id="${this.selId}"]`); if(p) p.classList.remove('selected'); }
                            this.selId = mk.getAttribute('data-id'); mk.classList.add('selected'); mk.parentNode.appendChild(mk);
                            UI.showAirportDetails(this.selId);
                        }
                    }
                    pointers.delete(e.pointerId);
                    if(pointers.size===1) { const rem = Array.from(pointers.values())[0]; dragStart = {x:rem.clientX, y:rem.clientY}; isDrag = true; }
                    else if(pointers.size===0) { initDist = null; isDrag = false; dragStart = null; svg.classList.remove('dragging'); }
                };
                svg.onpointerup = end; svg.onpointercancel = end; svg.onwheel = e => { e.preventDefault(); const c = this.getSVGCoords(e.clientX, e.clientY); this.applyZoom(e.deltaY>0?(1/1.2):1.2, c.x, c.y); };
            },
            clearSelection() { if(this.selId) { const p = document.querySelector(`.airport-marker[data-id="${this.selId}"]`); if(p) p.classList.remove('selected'); this.selId = null; } }
        };

        // ==========================================
        // Game Save/Load, Migration & Init
        // ==========================================
        const Game = {
            init() {
                ThemeManager.init();
                
                const hqSelect = document.getElementById('c-hq'); hqSelect.innerHTML = '';
                GameData.Airports.forEach(ap => { hqSelect.innerHTML += `<option value="${ap.id}">${ap.name} (${ap.iata})</option>`; });

                try {
                    const saved = localStorage.getItem(GameData.SAVE_KEY);
                    if (saved) {
                        const data = JSON.parse(saved);
                        if (this.validateSaveData(data)) {
                            // Version comparison
                            if (this.compareVer(data.version, GameData.VERSION) > 0) {
                                console.warn("Future save data detected.");
                                document.getElementById('btn-continue').disabled = true;
                                return;
                            }
                            document.getElementById('btn-continue').disabled = false;
                            document.getElementById('btn-continue').textContent = `CONTINUE (${data.company.name})`;
                        }
                    }
                } catch(e) {
                    console.error("Initialization check error", e);
                }
            },

            compareVer(v1, v2) {
                if(!v1) return -1;
                const p1 = v1.replace('v','').split('.').map(Number); const p2 = v2.replace('v','').split('.').map(Number);
                for(let i=0; i<Math.max(p1.length, p2.length); i++) {
                    const n1 = p1[i]||0, n2 = p2[i]||0;
                    if(n1 > n2) return 1; if(n1 < n2) return -1;
                }
                return 0;
            },

            validateSaveData(data) {
                if (!data || typeof data !== 'object') return false;
                if (!data.company || typeof data.company.name !== 'string') return false;
                if (typeof data.company.funds !== 'number' || isNaN(data.company.funds)) return false;
                if (!Array.isArray(data.company.fleet) || !Array.isArray(data.company.routes)) return false;
                return true;
            },

            migrateSaveData(data) {
                // Ensure all fields required for v0.1.3 exist
                if (!data.version) data.version = GameData.VERSION;
                if (data.company.reputation === undefined) data.company.reputation = 50;
                if (data.company.awareness === undefined) data.company.awareness = 10;
                
                data.company.fleet.forEach(f => {
                    if (!f.stats) f.stats = { flights: 0, pax: 0, rev: 0 };
                    if (f.status === undefined) f.status = f.routeId ? 'active' : 'idle';
                });

                data.company.routes.forEach(r => {
                    if (!r.stats) {
                        r.stats = { flights: 0, pax: 0, rev: 0, profit: 0, lastLf: 0, lastPax: 0, lastRev: 0, lastCost: 0, lastProfit: 0, lastFlights: 0 };
                    }
                });

                data.version = GameData.VERSION;
                return data;
            },

            startNewGame() { document.getElementById('form-setup').reset(); UI.switchScreen('screen-new-company'); },
            
            submitNewCompany(e) {
                e.preventDefault();
                const name = document.getElementById('c-name').value.trim();
                const iata = document.getElementById('c-iata').value.toUpperCase();
                const icao = document.getElementById('c-icao').value.toUpperCase();
                
                Player = {
                    version: GameData.VERSION,
                    metadata: { createdAt: new Date().toISOString(), lastPlayed: new Date().toISOString() },
                    company: {
                        name, iata, icao, color: document.getElementById('c-color').value, hq: document.getElementById('c-hq').value,
                        funds: GameData.START_FUNDS, reputation: 50, awareness: 10, date: GameData.START_DATE,
                        fleet: [], routes: [], employees: 0, debt: 0
                    },
                    history: [{ date: GameData.START_DATE, msg: `${name} を設立しました。` }]
                };
                if (this.saveData(false)) this.enterHQ();
            },

            continueGame() {
                try {
                    const rawText = localStorage.getItem(GameData.SAVE_KEY);
                    if (!rawText) return;
                    let rawData = JSON.parse(rawText);

                    if (this.compareVer(rawData.version, GameData.VERSION) > 0) {
                        UI.showModal('エラー', 'このセーブデータは現在のゲームより新しいバージョンで作成されています。データの破損を防ぐため読み込みを中止しました。');
                        return;
                    }

                    if (!this.validateSaveData(rawData)) {
                        UI.showModal('エラー', 'セーブデータの検証に失敗しました。');
                        return;
                    }

                    Player = this.migrateSaveData(rawData);
                    this.enterHQ();
                } catch(e) {
                    console.error(e);
                    UI.showModal('エラー', 'セーブデータのロードに失敗しました。');
                }
            },

            enterHQ() {
                UI.switchScreen('screen-hq');
                UI.updateHeader(); UI.updateNews();
                MapSystem.initMap();
                setTimeout(() => {
                    const hq = GameData.Airports.find(a => a.id === Player.company.hq);
                    if(hq) { const pt = MapSystem.project(hq.lat, hq.lon); MapSystem.applyZoom(1.8, pt.x, pt.y); }
                }, 100);
            },

            saveData(isAuto = false) {
                if (!Player) return false;
                try {
                    // Prevent downgrading overwrite
                    const exist = localStorage.getItem(GameData.SAVE_KEY);
                    if (exist) {
                        const ed = JSON.parse(exist);
                        if (this.compareVer(ed.version, GameData.VERSION) > 0) {
                            console.error("Autosave blocked to prevent overwrite.");
                            return false;
                        }
                    }
                    Player.metadata.lastPlayed = new Date().toISOString();
                    localStorage.setItem(GameData.SAVE_KEY, JSON.stringify(Player));
                    return true;
                } catch(e) {
                    if (isAuto) UI.showToast("自動セーブに失敗しました。ブラウザの保存領域を確認してください。", "error");
                    else UI.showModal('エラー', 'セーブデータの保存に失敗しました。');
                    return false;
                }
            },
            
            manualSave() { if(this.saveData(false)) UI.showToast("ゲームをセーブしました", "success"); },
            returnToTitle() { this.saveData(true); Player = null; UI.switchScreen('screen-title'); this.init(); }
        };

        window.onload = () => { try { Game.init(); } catch(e) { console.error(e); alert("初期化エラーが発生しました"); } };
    </script>
</body>
